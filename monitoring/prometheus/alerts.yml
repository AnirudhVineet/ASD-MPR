groups:
  - name: clubapp
    rules:
      - alert: ClubAppDown
        expr: up{job="clubapp"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Club Manager web app is down
          description: Prometheus has not been able to scrape {{ $labels.instance }} for 1 minute.

      - alert: ClubAppHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="clubapp", status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="clubapp"}[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of requests are failing with 5xx
          description: "5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: ClubAppSlowResponses
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="clubapp"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: p95 latency above 1s
          description: "p95 request latency is {{ $value | humanizeDuration }}."
