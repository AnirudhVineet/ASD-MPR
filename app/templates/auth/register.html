{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form method="post" class="stack card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Full name <input name="name" value="{{ name or '' }}" required></label>
  <label>College email <input type="email" name="email" value="{{ email or '' }}" required></label>
  <label>Password <input type="password" name="password" minlength="8" required></label>
  <button class="btn" type="submit">Register</button>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</form>
{% endblock %}
