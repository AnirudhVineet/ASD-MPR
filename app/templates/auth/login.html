{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="stack card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Email <input type="email" name="email" value="{{ email or '' }}" required></label>
  <label>Password <input type="password" name="password" required></label>
  <label class="row"><input type="checkbox" name="remember" style="width:auto"> Remember me</label>
  <button class="btn" type="submit">Log in</button>
  <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</form>
{% endblock %}
