name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROMETHEUS_IMAGE: prom/prometheus:v2.54.1

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -v

  validate-config:
    name: Validate monitoring & compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml

      - name: Check Grafana dashboard JSON
        run: python -m json.tool monitoring/grafana/dashboards/club-manager.json > /dev/null

      - name: Check docker compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

  smoke:
    name: Docker Compose smoke test
    needs: [test, validate-config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180

      - name: App responds
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/ > /dev/null
          curl -fsS http://localhost:8000/clubs/ > /dev/null
          curl -fsS http://localhost:8000/metrics | grep -q '^clubapp_users '

      - name: Admin CLI works against PostgreSQL
        run: |
          docker compose exec -T web flask create-admin \
            --email ci-admin@example.com --name "CI Admin" --password ci-password-123

      - name: Prometheus scrapes the app
        run: |
          for i in $(seq 1 20); do
            if curl -fsS 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22clubapp%22%7D' \
                | grep -q '"value":\[[0-9.]*,"1"\]'; then
              echo "clubapp target is up"; exit 0
            fi
            sleep 5
          done
          echo "Prometheus never saw the clubapp target as up"
          curl -sS http://localhost:9090/api/v1/targets
          exit 1

      - name: Grafana has the provisioned dashboard
        run: |
          source .env
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 3
          done
          curl -fsS -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
            http://localhost:3000/api/dashboards/uid/club-manager | grep -q '"title":"Club Manager"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image to GHCR
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/club-manager
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
